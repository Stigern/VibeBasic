# Type check and tests (TypeScript and Rust) on macOS, Windows and Linux, for every push to a branch and every pull request.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The Windows runner's git turns LF into CRLF on checkout; the tests read sources and fixtures byte for byte.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Linux packages for Tauri (WebKitGTK, libsoup)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file

      - name: Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: TypeScript tests
        run: npm test

      # tauri::generate_context! embeds the frontend (frontendDist = ../dist), so the Rust crate needs it built first.
      - name: Build the frontend
        run: npx vite build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
