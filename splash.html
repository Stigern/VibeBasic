<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VibeBasic</title>
    <style>html, body { margin: 0; overflow: hidden; background: #fff; user-select: none; -webkit-user-select: none; cursor: default; } svg { display: block; }</style>
  </head>
  <!-- The splash window (src-tauri/src/splash.rs): shown while the IDE loads, closed by the main window once it is ready. -->
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-label="VibeBasic">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#e9edf4"/>
        </linearGradient>
        <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2f56d8"/>
          <stop offset="1" stop-color="#0a1d7a"/>
        </linearGradient>
        <linearGradient id="blueTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc4ff"/><stop offset="1" stop-color="#4f86f0"/></linearGradient>
        <linearGradient id="blueL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a5fd6"/><stop offset="1" stop-color="#173c9e"/></linearGradient>
        <linearGradient id="purpTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d5b8ff"/><stop offset="1" stop-color="#9a6af0"/></linearGradient>
        <linearGradient id="purpL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a45d8"/><stop offset="1" stop-color="#4d2696"/></linearGradient>
        <linearGradient id="purpR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9563ea"/><stop offset="1" stop-color="#6436b8"/></linearGradient>
        <linearGradient id="goldTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="1" stop-color="#f5c43a"/></linearGradient>
        <linearGradient id="goldL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9a514"/><stop offset="1" stop-color="#b9780a"/></linearGradient>
        <linearGradient id="goldR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5bb2a"/><stop offset="1" stop-color="#cf8d0e"/></linearGradient>
        <radialGradient id="ball" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#ffd9b0"/><stop offset="0.45" stop-color="#ff8a2a"/><stop offset="1" stop-color="#b84a06"/></radialGradient>
        <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ab8f5"/><stop offset="0.45" stop-color="#2367d6"/><stop offset="1" stop-color="#0e2f86"/></linearGradient>
        <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000080"/><stop offset="1" stop-color="#1084d0"/></linearGradient>
        <filter id="soft" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
        <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1a2240" stop-opacity="0.45"/><stop offset="1" stop-color="#1a2240" stop-opacity="0"/></radialGradient>
      </defs>
    
      <rect width="480" height="360" fill="url(#bg)"/>
      <rect width="480" height="22" fill="#000"/>
      <text x="18" y="15" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fff">Visual Basic, the way you remember it, with an AI at your side</text>
    
      <g transform="translate(-14 -8)">
        <ellipse cx="392" cy="188" rx="104" ry="20" fill="url(#shade)" filter="url(#soft)"/>
        <ellipse cx="392" cy="186" rx="70" ry="9" fill="#1a2240" opacity="0.18" filter="url(#soft)"/>
        <polygon points="390,36 431.6,60 390,84 348.4,60" fill="url(#blueTop)"/>
        <polygon points="348.4,60 390,84 390,132 348.4,108" fill="url(#blueL)"/>
        <polygon points="390,84 431.6,60 431.6,108 390,132" fill="#c9d3e3"/>
        <g transform="matrix(0.8667 -0.5 0 1 390 84)">
          <rect x="0" y="0" width="48" height="48" fill="#d4d0c8"/>
          <rect x="0" y="0" width="48" height="9" fill="url(#title)"/>
          <rect x="40" y="2" width="6" height="5" fill="#d4d0c8"/>
          <rect x="6" y="16" width="20" height="6" fill="#fff" stroke="#808080" stroke-width="0.6"/>
          <rect x="6" y="27" width="14" height="7" fill="#e6e2da" stroke="#404040" stroke-width="0.6"/>
          <circle cx="34" cy="38" r="0.8" fill="#888"/><circle cx="40" cy="38" r="0.8" fill="#888"/><circle cx="34" cy="43" r="0.8" fill="#888"/><circle cx="40" cy="43" r="0.8" fill="#888"/>
        </g>
    
        <polygon points="346,92 387.6,116 346,140 304.4,116" fill="url(#purpTop)"/>
        <polygon points="304.4,116 346,140 346,188 304.4,164" fill="url(#purpL)"/>
        <polygon points="346,140 387.6,116 387.6,164 346,188" fill="url(#purpR)"/>
        <g transform="matrix(0.8667 -0.5 0 1 346 140)" fill="#e9ddff">
          <rect x="7" y="12" width="22" height="4" rx="1"/><rect x="13" y="21" width="26" height="4" rx="1"/><rect x="13" y="30" width="18" height="4" rx="1"/><rect x="7" y="39" width="12" height="4" rx="1"/>
        </g>
        <ellipse cx="346" cy="118" rx="16" ry="6" fill="#4d2696" opacity="0.35"/>
        <circle cx="346" cy="104" r="16" fill="url(#ball)"/>
    
        <polygon points="434,92 475.6,116 434,140 392.4,116" fill="url(#goldTop)"/>
        <polygon points="392.4,116 434,140 434,188 392.4,164" fill="url(#goldL)"/>
        <polygon points="434,140 475.6,116 475.6,164 434,188" fill="url(#goldR)"/>
        <g transform="matrix(0.8667 0.5 0 1 392.4 116)">
          <text x="24" y="33" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="17" fill="#fff6d0">AI</text>
        </g>
      </g>
      <path d="M452 30 Q455 44 468 47 Q455 50 452 64 Q449 50 436 47 Q449 44 452 30 Z" fill="#fff4b0" stroke="#e9b818" stroke-width="1"/>
      <path d="M470 70 Q471.5 76 477 77.5 Q471.5 79 470 85 Q468.5 79 463 77.5 Q468.5 76 470 70 Z" fill="#ffffff" stroke="#e9b818" stroke-width="0.8"/>
    
      <text x="22" y="170" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#3b3b3b" letter-spacing="-0.5">Vibe</text>
      <text x="18" y="224" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="58" fill="url(#word)" letter-spacing="-2">Basic</text>
      <text x="198" y="224" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-weight="bold" font-size="42" fill="url(#word)"><tspan id="version"></tspan></text>
      <rect x="150" y="233" width="132" height="22" fill="#fff" stroke="#000" stroke-width="1"/>
      <rect x="152" y="255" width="132" height="2" fill="#7a7a7a"/>
      <rect x="282" y="235" width="2" height="22" fill="#7a7a7a"/>
      <text x="216" y="249" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#000">AI Edition</text>
    
      <g transform="translate(22 284)">
        <rect x="0" y="0" width="44" height="44" rx="10" fill="url(#tile)"/>
        <rect x="8" y="10" width="28" height="24" rx="2" fill="#dcdcdc" stroke="#555" stroke-width="0.6"/>
        <rect x="8" y="10" width="28" height="5" fill="url(#title)"/>
        <text x="22" y="31" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="11" fill="#1236a8">VB</text>
        <text x="54" y="18" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#1a1a1a">VibeBasic</text>
        <text x="54" y="34" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#555">macOS · Windows · Linux</text>
      </g>
    
      <text x="458" y="340" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666">Loading...</text>
    </svg>
    <script type="module" src="/src/splash/splash.ts"></script>
  </body>
</html>
