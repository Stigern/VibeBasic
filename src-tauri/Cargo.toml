[package]
name = "app"
version = "0.10.3"
description = "VibeBasic"
authors = ["VibeBasic"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.3"
plist = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "sync", "macros"] }
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serialport = { version = "4.10", default-features = false }
libc = "0.2"
# Make on Windows: the made exe's icon and version resource (pure Rust; without its image feature). png: the icon sizes.
editpe = { version = "0.2.4", default-features = false, features = ["std"] }
png = "0.18"

# Clipboard off macOS (macOS keeps pbcopy / pbpaste). No image support: only text is used.
[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { version = "3", default-features = false }

# Printers, power status, drives, file attributes, processes and the raw command line on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Graphics_Printing",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# macOS 27: dyld rejects stripped proc-macro dylibs ("mis-aligned LINKEDIT string pool")
[profile.release]
strip = "none"
