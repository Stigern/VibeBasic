[package]
name = "app"
version = "0.8.1"
description = "VibeBasic"
authors = ["VibeBasic"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.3"
plist = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "sync", "macros"] }
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serialport = { version = "4.10", default-features = false }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# macOS 27: dyld rejects stripped proc-macro dylibs ("mis-aligned LINKEDIT string pool")
[profile.release]
strip = "none"
