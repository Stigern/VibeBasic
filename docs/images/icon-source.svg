<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- glossy squircle background: Win98 navy to bright title-bar blue -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8cf0"/>
      <stop offset="0.55" stop-color="#1257c4"/>
      <stop offset="1" stop-color="#06247a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#021a5c" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Win98 title bar -->
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#1084d0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ececec"/>
      <stop offset="1" stop-color="#bdbdbd"/>
    </linearGradient>
    <linearGradient id="vb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a4fd6"/>
      <stop offset="1" stop-color="#00137a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#00103a" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000033" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="squircle"><rect x="72" y="72" width="880" height="880" rx="196"/></clipPath>
  </defs>

  <!-- base squircle with soft outer shadow -->
  <g filter="url(#shadow)">
    <rect x="72" y="72" width="880" height="880" rx="196" fill="url(#bg)"/>
  </g>
  <!-- subtle rim -->
  <rect x="74" y="74" width="876" height="876" rx="194" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- glossy highlight over the top half, FuMachine style -->
  <g clip-path="url(#squircle)">
    <path d="M72 72 H952 V420 C780 470 260 470 72 400 Z" fill="url(#gloss)"/>
  </g>

  <!-- classic Win98 window, rounded a little for the modern look -->
  <g filter="url(#soft)">
    <rect x="212" y="236" width="600" height="520" rx="34" fill="url(#face)"/>
    <!-- 3D bevel -->
    <rect x="220" y="244" width="584" height="504" rx="28" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.9"/>
    <rect x="212" y="236" width="600" height="520" rx="34" fill="none" stroke="#5a5a5a" stroke-width="5"/>
    <!-- title bar -->
    <path d="M246 236 h532 a34 34 0 0 1 34 34 v62 h-600 v-62 a34 34 0 0 1 34 -34 z" fill="url(#title)"/>
    <!-- title bar buttons -->
    <g>
      <rect x="640" y="257" width="44" height="40" rx="7" fill="url(#face)" stroke="#404040" stroke-width="3"/>
      <rect x="652" y="284" width="20" height="5" fill="#000"/>
      <rect x="694" y="257" width="44" height="40" rx="7" fill="url(#face)" stroke="#404040" stroke-width="3"/>
      <rect x="704" y="266" width="24" height="21" fill="none" stroke="#000" stroke-width="4"/>
      <rect x="748" y="257" width="44" height="40" rx="7" fill="url(#face)" stroke="#404040" stroke-width="3"/>
      <path d="M759 267 l22 20 M781 267 l-22 20" stroke="#000" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- tiny title text bars -->
    <rect x="250" y="270" width="150" height="16" rx="8" fill="#ffffff" fill-opacity="0.85"/>
    <!-- designer grid dots -->
    <g fill="#8a8a8a" fill-opacity="0.55">
      <circle cx="262" cy="372" r="4"/><circle cx="302" cy="372" r="4"/><circle cx="342" cy="372" r="4"/>
      <circle cx="262" cy="412" r="4"/><circle cx="262" cy="452" r="4"/><circle cx="262" cy="492" r="4"/>
      <circle cx="262" cy="532" r="4"/><circle cx="262" cy="572" r="4"/><circle cx="262" cy="612" r="4"/>
      <circle cx="262" cy="652" r="4"/><circle cx="262" cy="692" r="4"/>
      <circle cx="762" cy="692" r="4"/><circle cx="722" cy="692" r="4"/><circle cx="682" cy="692" r="4"/>
      <circle cx="762" cy="652" r="4"/><circle cx="762" cy="612" r="4"/>
    </g>
    <!-- big bold VB -->
    <text x="512" y="642" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="300" letter-spacing="-10" fill="#ffffff" opacity="0.9" transform="translate(5 7)">VB</text>
    <text x="512" y="642" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="300" letter-spacing="-10" fill="url(#vb)">VB</text>
    <!-- a selected CommandButton with sizing handles -->
    <rect x="520" y="676" width="190" height="48" rx="10" fill="url(#face)" stroke="#404040" stroke-width="3"/>
    <g fill="#000080">
      <rect x="512" y="668" width="14" height="14"/><rect x="704" y="668" width="14" height="14"/>
      <rect x="512" y="718" width="14" height="14"/><rect x="704" y="718" width="14" height="14"/>
    </g>
  </g>

  <!-- AI sparkle -->
  <g transform="translate(800 214)">
    <path d="M0 -74 C10 -18 18 -10 74 0 C18 10 10 18 0 74 C-10 18 -18 10 -74 0 C-18 -10 -10 -18 0 -74 Z" fill="#ffe46b" filter="url(#glow)" opacity="0.8"/>
    <path d="M0 -70 C9 -17 17 -9 70 0 C17 9 9 17 0 70 C-9 17 -17 9 -70 0 C-17 -9 -9 -17 0 -70 Z" fill="#fff6c2"/>
    <path d="M-62 92 C-58 112 -54 116 -34 120 C-54 124 -58 128 -62 148 C-66 128 -70 124 -90 120 C-70 116 -66 112 -62 92 Z" fill="#ffffff" opacity="0.9"/>
  </g>

</svg>
